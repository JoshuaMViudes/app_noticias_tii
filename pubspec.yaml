name: app_noticias_tii
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/icone-portal-br.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FF0000"
  image: assets/img/splash-portal-br-1152.png
  fullscreen: true
  android_12:
    color: "#FF0000"
    image: assets/img/splash-portal-br-1152.png
